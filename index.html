<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="styles/index.css">
</head>
<body>

    <div class="caixa">
        <div class="esquerda">
            <h1>Faça seu login<span></span></h1>

            <form action="exercicio.html">
                <label>Email</label>
                <input type="email" placeholder="seuemail@exemplo.com" required>

                <label>Senha</label>
                <input type="password" placeholder="********" required>

                <a href="#" id="esqueci">Esqueci minha senha</a>

                <button type="submit">Entrar</button>
            </form>

            <p class="conta"><a href="sobre.html">Ainda não tenho uma conta</a></p>
        </div>

        <div class="direita">
            <img src="imgs/dog.jpg" alt="Foto dos meus cachorros">
        </div>
    </div>

</body>
</html>
